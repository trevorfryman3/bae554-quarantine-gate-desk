[project]
name = "quarantine-gate-desk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# makes tools/ and eval/ importable when pytest runs via its entry script (uv run pytest)
pythonpath = ["."]
